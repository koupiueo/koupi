      @keyframes x-crt {
        0%   { transform: scale(1, 1); filter: brightness(1); opacity: 1; }
        55%  { transform: scale(1, .006); filter: brightness(3); opacity: 1; }
        100% { transform: scale(0, .006); filter: brightness(5); opacity: 0; }

      #post { position: fixed; inset: 0; background: #0d0f14; color: #c9d1d9; padding: 24px max(24px, calc((100vw - 1100px) / 2)); display: none; overflow: hidden;

      #post.x-on { display: block; }
      @media (max-width: 499px) { #post { padding: 12px; } }
      #post .g { color: #7ee787; } #post .y { color: #f2cc60; } #post .c { color: #79c0ff; } #post .d { color: #8b949e; }

    <script>
      (function () {
        var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        var ready = false, going = false, h = null;
        function onDone() { ready = true; document.body.classList.add("x-ready"); }
        function begin() {
          ready = false; document.body.classList.remove("x-ready");
          h = KoupiFine.start(document.getElementById("intro"), null, onDone);
        }
        function restart() {
          if (going) return;
          if (h && h.stop) h.stop();
          ["intro", "intro-status"].forEach(function (id) {
            var el = document.getElementById(id), fresh = el.cloneNode(false);
            fresh.removeAttribute("style");
            el.replaceWith(fresh);
          });
          begin();
        }
        document.getElementById("replay").addEventListener("click", function (e) { e.stopPropagation(); restart(); });

        /* ---- boot: CRT off -> POST screen -> terminal ---- */
        var post = document.getElementById("post");
        /* the terminal is a whole page of its own; it replaces this document in place, so everything stays one file */
        var gone = false;
        function go() {
          if (gone) return; gone = true;
          var bytes = Uint8Array.from(atob(TERM_B64), function (c) { return c.charCodeAt(0); });
          var html = new TextDecoder("utf-8").decode(bytes);
          var m = cellSize();
          html = html.replace("</head>", "<style>:root{--fs:" + m.fs + "px;--lh:" + m.lh + "px}</style></head>");
          document.open(); document.write(html); document.close();
        }
        function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
        function line(html) { var p = document.createElement("div"); p.innerHTML = html; post.insertBefore(p, post.lastChild); return p; }
        /* blocky, stepped dissolve: the frozen frame is erased one character cell at a time, at a choppy ~14 fps */
        async function pixelOut() {
          var src = document.getElementById("intro"), r = src.getBoundingClientRect();
          var cv = document.createElement("canvas");
          cv.width = src.width; cv.height = src.height;
          cv.style.cssText = "position:fixed;left:" + r.left + "px;top:" + r.top + "px;width:" + r.width + "px;height:" + r.height + "px;z-index:5;image-rendering:pixelated";
          var c = cv.getContext("2d");
          c.drawImage(src, 0, 0);
          document.body.appendChild(cv);
          document.getElementById("stage").style.visibility = "hidden";
          var bw = Math.max(2, Math.round(cv.width / Math.max(1, r.width / 9))), bh = bw * 2;   // one terminal cell
          var nx = Math.ceil(cv.width / bw), ny = Math.ceil(cv.height / bh), cells = [];
          var img = c.getImageData(0, 0, cv.width, cv.height).data;
          function lit(x, y) {          // does this cell hold any drawn character?
            for (var k = 1; k < 4; k++) {
              var px = Math.min(cv.width - 1, x * bw + (bw * k >> 2)), py = Math.min(cv.height - 1, y * bh + (bh * k >> 2));
              if (img[(py * cv.width + px) * 4 + 3] > 40) return true;
            }
            return false;
          }
          for (var y = 0; y < ny; y++) for (var x = 0; x < nx; x++) if (lit(x, y)) cells.push([x, y, Math.random() + (y / ny) * 0.35]);
          cells.sort(function (a, b) { return a[2] - b[2]; });     // random, drifting slightly top to bottom
          var STEPS = 8, per = Math.ceil(cells.length / STEPS);
          for (var s = 0; s < STEPS; s++) {
            var part = cells.slice(s * per, (s + 1) * per);
            // a few cells flash to solid before they go, like dead pixels
            c.fillStyle = "#e6edf3";
            for (var i = 0; i < part.length; i += 4) c.fillRect(part[i][0] * bw, part[i][1] * bh, bw, bh);
            await sleep(35);
            part.forEach(function (q) { c.clearRect(q[0] * bw, q[1] * bh, bw, bh); });
            await sleep(40);
          }
          cv.remove();
          await sleep(120);
        }
        /* the intro's character cell, so every screen after it keeps the same text size */
        function cellSize() {
          var cw = parseFloat(document.getElementById("intro").dataset.cw) || 8.5;
          return { fs: (cw * 1.6).toFixed(2), lh: (cw * 2).toFixed(2) };
        }
        async function boot() {
          if (going) return;
          going = true;
          if (reduce) return go();
          document.getElementById("replay").style.visibility = "hidden";
          await pixelOut();
          var m = cellSize();
          post.style.fontSize = m.fs + "px"; post.style.lineHeight = m.lh + "px";
          post.innerHTML = '<span class="cur"></span>';
          post.classList.add("x-on");
          var skip = function () { go(); };
          post.addEventListener("pointerdown", skip);
          window.addEventListener("keydown", skip);
          await sleep(260);
          line('<span class="c">KOUPI BIOS</span> v15.44  <span class="d">(C) 2011-2026 koupi</span>');
          await sleep(120);
          line('CPU  : Tora Cat Engine @ 9 lives');
          await sleep(110);
          var mem = line('Memory Test : 0K');
          for (var k = 0; k <= 16; k++) { mem.textContent = "Memory Test : " + (k * 4096) + "K"; await sleep(22); }
          mem.innerHTML = 'Memory Test : 65536K <span class="g">OK</span>';
          await sleep(160);
          line(' ');
          line('Detecting devices ...');
          await sleep(180);
          line('  /dev/catbox0 ........ <span class="g">OK</span>');
          await sleep(110);
          line('  /dev/keyboard ....... <span class="g">OK</span>');
          await sleep(110);
          line('  /dev/coffee ......... <span class="y">LOW</span>');
          await sleep(200);
          line(' ');
          line('Booting from <span class="c">koupi.dev</span> ...');
          await sleep(520);
          go();
        }
        function tryBoot(e) {
          if (!ready || going) return;
          if (e && e.target && e.target.closest && e.target.closest("button")) return;
          boot();
        }
        document.addEventListener("click", tryBoot);
        window.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { if (ready && !going) e.preventDefault(); tryBoot(e); }
        });
        begin();
      })();
    </script>
  </body>
</html>
